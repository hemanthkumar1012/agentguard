services:
  - type: web
    name: agentguard-api
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    maxShutdownDelaySeconds: 30
    envVars:
      - key: AGENTGUARD_ENV
        value: production
      - key: AGENTGUARD_POLICY_VERSION
        value: 2026.09
      - key: AGENTGUARD_RATE_LIMIT
        value: "120"
      - key: AGENTGUARD_RATE_LIMIT_WINDOW
        value: "60"
      - key: AGENTGUARD_CORS_ORIGINS
        sync: false
      - key: AGENTGUARD_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
