[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-api"
version = "2.0.0"
description = "SentinelForge: policy enforcement, evaluation and observability for AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "supabase>=2.18,<3.0",
    "python-dotenv>=1.1,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-exporter-otlp>=1.30,<2.0",
]
test = [
    "pytest>=8.4,<9.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
