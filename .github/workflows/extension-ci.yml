name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest ok')"

      - name: Check extension JavaScript
        shell: bash
        run: |
          set -e
          for file in extension/*.js; do
            node --check "$file"
          done

      - name: Package extension
        shell: bash
        run: |
          set -e
          rm -f agentguard-browser-extension.zip
          zip -r agentguard-browser-extension.zip extension -x 'extension/.DS_Store'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-browser-extension
          path: agentguard-browser-extension.zip
          if-no-files-found: error