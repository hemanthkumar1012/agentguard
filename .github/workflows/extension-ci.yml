name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest ok')"

      - name: Check extension JavaScript
        shell: bash
        run: |
          set -e
          for file in extension/*.js; do
            node --check "$file"
          done

      - name: Prepare release extension
        run: node extension/build-release.js

      - name: Package release extension
        shell: bash
        run: |
          set -e
          rm -f agentguard-browser-extension.zip
          cd extension/dist
          zip -r ../../agentguard-browser-extension.zip agentguard-browser-extension
          cd ../..

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-browser-extension
          path: agentguard-browser-extension.zip
          if-no-files-found: error

      - name: Install browser E2E dependencies
        working-directory: extension/e2e
        run: npm install

      - name: Install Chromium
        working-directory: extension/e2e
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: extension/e2e
        run: xvfb-run -a npm test
