name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Datasets are reproducible from the generator
        working-directory: .
        run: python datasets/generate_datasets.py && git diff --exit-code datasets/

      - name: Release gate - released version must pass
        run: python scripts/release_gate.py support-agent-v1.0 --json eval-v1.0.json

      - name: Release gate - fixed candidate must pass
        run: python scripts/release_gate.py support-agent-v2.1

      - name: Release gate - regressed candidate must be blocked
        run: python scripts/release_gate.py support-agent-v2.0 --expect blocked

      - name: Release gate - compromised simulator must be blocked
        run: python scripts/release_gate.py support-agent-compromised --expect blocked

      - name: Adaptive red-team - containment must stay 100%, detector false positives <= 2%
        run: |
          python scripts/fuzz.py support-agent-v2.1 --budget 400 --min-detection 0.95
          python scripts/fuzz.py support-agent-v2.0 --budget 800 --generations 5 --min-detection 0.95 --export fuzz-undetected.jsonl

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-evidence
          path: |
            backend/eval-*.json
            backend/fuzz-*.jsonl
          if-no-files-found: ignore

      - name: Build production API image
        working-directory: .
        run: docker build --tag agentguard-api:ci .

  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Rego policy tests (parity with the Python engine)
        run: opa test policy/opa -v

      - name: Rego formatting
        run: opa fmt --list --fail policy/opa/sentinelforge.rego policy/opa/sentinelforge_test.rego
